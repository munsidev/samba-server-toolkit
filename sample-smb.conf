# ==============================================================================
# SAMPLE SAMBA CONFIGURATION FILE (EXAMPLE ONLY - DO NOT OVERWRITE AUTOMATICALLY)
# ==============================================================================
# Course: Operating Systems Course Project
# Description:
#   This file demonstrates standard Ubuntu [global] Samba parameters along with
#   the delimiter-scoped managed share block format utilized by `samba-toolkit.sh`.
#
# Usage:
#   Reference only. The toolkit automatically creates timestamped backups of
#   /etc/samba/smb.conf before inserting or removing any managed blocks.
# ==============================================================================

[global]
    # General Server Settings
    workgroup = WORKGROUP
    server string = Ubuntu Samba File Server (Course Project)
    server role = standalone server
    dns proxy = no

    # Logging Parameters
    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file
    panic action = /usr/share/samba/panic-action %d

    # Authentication & Security
    server signing = default
    obey pam restrictions = yes
    unix password sync = yes
    passwd program = /usr/bin/passwd %u
    passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
    pam password change = yes
    map to guest = bad user

    # Disable Guest / Anonymous Usershare Creation
    usershare allow guests = no

# ==============================================================================
# EXAMPLE TOOLKIT MANAGED SHARE SECTION
# Any share created with `samba-toolkit.sh` will appear bounded by these markers.
# The toolkit uses these comment lines to parse, update, or remove shares without
# altering unrelated global or manual share configurations.
# ==============================================================================

# === BEGIN SAMBA-TOOLKIT MANAGED SHARE: [course_share] ===
[course_share]
    comment = Operating Systems Course Project Shared Directory
    path = /srv/samba/course_share
    valid users = ubuntu
    read only = no
    browsable = yes
    guest ok = no
    create mask = 0660
    directory mask = 0770
# === END SAMBA-TOOLKIT MANAGED SHARE: [course_share] ===

# ==============================================================================
# ADDITIONAL EXAMPLE READ-ONLY ARCHIVE SHARE
# ==============================================================================

# === BEGIN SAMBA-TOOLKIT MANAGED SHARE: [course_archive] ===
[course_archive]
    comment = Read-Only Archive for Course Material
    path = /srv/samba/course_archive
    valid users = student
    read only = yes
    browsable = yes
    guest ok = no
    create mask = 0660
    directory mask = 0770
# === END SAMBA-TOOLKIT MANAGED SHARE: [course_archive] ===
